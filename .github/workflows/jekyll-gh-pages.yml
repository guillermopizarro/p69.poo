name: Publicar pagina POO

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Preparar y comprobar pagina
        run: |
          mkdir -p _public
          cp index.html _public/index.html
          cp -R assets _public/assets
          cp -R recursos _public/recursos
          touch _public/.nojekyll
          test -f _public/assets/estilos.css
          grep -q 'assets/estilos.css' _public/index.html
          cmp index.html _public/index.html

      - name: Subir pagina
        uses: actions/upload-pages-artifact@v3
        with:
          path: _public

      - name: Publicar
        id: deploy
        uses: actions/deploy-pages@v4